Name: EQLogParser
Description: EQLogParser v2.3.62
Grade: Gold
Arch: win64

# vcredist2022 is not optional. The speech engines download a Microsoft onnxruntime that imports msvcp140,
# msvcp140_1, vcruntime140 and vcruntime140_1, none of which Wine supplies; without the redistributable an
# installed Piper or Kokoro pack loads its files and then stays silent with
# "Unable to load DLL 'onnxruntime' ... Module not found".
Dependencies:
- vcredist2022
- dotnetdesktop8
- allfonts

Parameters:
  dxvk: false
  vkd3d: false
  sync: wine

Executable:
  name: EQLogParser
  file: EQLogParser.exe
  icon: EQLogParser.ico
  path: Program Files/EQLogParser/EQLogParser.exe

Steps:
- action: install_exe
  file_name: EQLogParser-install-2.3.62.exe
  url: https://github.com/kauffman12/EQLogParser/releases/download/2.3.62/EQLogParser-install-2.3.62.exe
  file_checksum: False

Checks:
  files:
    - 'Program Files/EQLogParser/EQLogParser.exe'
